# SPEA2 parameter tuning spec — UCT HPC, FULL 100-customer instances.
#
#   3 x 2 x 2 x 3 = 36 parameter sets (shards)
#   56 instances x 5 seeds = 280 solver runs per shard
#   10,080 solver runs total
#
# Prerequisite (once, from the repo root):
#     python scripts/download_instances.py --all
# make_configs.py refuses to generate if any instance file is missing.
#
# The grid brackets the values in reduced25_hard.yaml (pop_size 80,
# archive_size 60). generations is held at 200 so pop_size is the only budget
# knob — otherwise a "better" setting is just a bigger budget.
#
# Objectives follow tw_mode automatically:
#     ./hpc/submit.sh hpc/specs/spea2.yaml --tw-mode soft

algorithm: spea2
tw_mode: hard

n_runs: 5              # seeds per parameter set: 12345 .. 12349
base_seed: 12345
distance_rounding: null
# No max_customers: these are the full 100-customer Solomon instances.

fixed:
  generations: 200

grid:
  pop_size: [40, 80, 120]
  archive_size: [40, 60]
  crossover_rate: [0.7, 0.9]
  mutation_rate: [0.1, 0.3, 0.5]
  # k: [null]          # null -> sqrt(pop_size + archive_size), the SPEA2 default

