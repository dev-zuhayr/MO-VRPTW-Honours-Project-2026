[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movrptw"
version = "0.1.0"
description = "A modular framework for benchmarking metaheuristics on the Multi-Objective Vehicle Routing Problem with Time Windows (Solomon benchmarks)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lawton" }]
keywords = ["vrptw", "vrp", "metaheuristics", "optimization", "operations-research", "nsga-ii"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["movrptw", "movrptw.solvers"]
