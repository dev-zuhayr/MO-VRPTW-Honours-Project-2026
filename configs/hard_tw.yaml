algorithms:
  - name: spea2
    fixed: 
      tw_mode: hard 
      pop_size: 120
      archive_size: 60
      generations: 200
      crossover_rate: 0.9
      mutation_rate: 2

  - name: moaco
    fixed: 
      tw_mode: hard 
      n_ants: 50
      iterations: 300
      alpha: 1.0
      beta: 3.0
      rho: 0.1
      tau0: 1.0
      archive_size: 50

  - name: nsga2          # your teammate's algorithm, same conditions
    fixed:
      tw_mode: hard
      generations: 200
      crossover_rate: 1
      mutation_rate: 1

  - name: grasp
    fixed:
      tw_mode: hard
      iterations: 400
      alpha: 0.1
  
  - name: mopso
    fixed:
      tw_mode: hard
      max_archive: 50
      n_particles: 150
      n_iterations: 600

  - name: alns
    fixed:
      tw_mode: hard
      n_iterations: 3500 
      n_remove_frac: 0.15
      start_temp: 100.0
      cooling: 0.9995
