# HARD time windows: violations are INFEASIBLE.
# 2-objective. This is the mode that is directly comparable with the Gurobi
# exact baseline, which enforces e_i <= T_i <= l_i as a hard MILP constraint.
output: outputs/results_hard.xlsx
checkpoint_dir: outputs/checkpoints_hard
n_runs: 10
base_seed: 12345
n_jobs: 40
max_customers: 100

objectives: [total_distance, num_vehicles]   # NO total_tardiness -- it is always 0 here

